server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: meal-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/meals/**, /api/v1/vendors/**
        - id: payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/carts/**, /api/v1/payments/**, /api/v1/invoices/**
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
