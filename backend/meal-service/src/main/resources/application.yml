# ─── Application-specific ───────────────────────────────────────
app:
  openapi:
    server-url: ${APP_OPENAPI_SERVER_URL:http://localhost:8081}
    contact-email: support@mealmarket.com
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:3000
      - https://*.pages.dev
      - https://*.vercel.app

spring:
  application:
    name: meal-service

  # ─── Database ─────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meal_db}
    username: ${DB_USERNAME:mealuser}
    password: ${DB_PASSWORD:mealpass123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # ─── Kafka ────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: meal-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

  # ─── Redis ────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  # ─── Security / Keycloak ──────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/mealmarket}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/mealmarket/protocol/openid-connect/certs}
      client:
        registration:
          keycloak-admin:
            client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:meal-marketplace-backend}
            client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:bFcfLsXi9Y2wHkodCOcFczmVQPtSQH6D}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak-admin:
            token-uri: ${KEYCLOAK_ADMIN_TOKEN_PROVIDER_URI:http://localhost:8080/realms/mealmarket/protocol/openid-connect/token}

  # ─── File Upload ──────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # ─── Jackson ──────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ─── Server ─────────────────────────────────────────────────────
server:
  port: ${PORT:10000}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

# ─── MinIO ──────────────────────────────────────────────────────
minio:
  enabled: ${MINIO_ENABLED:true}                    # Keep enabled—your adapter just points at Garage now
  url: ${MINIO_URL:http://localhost:3900}       # Garage S3 API endpoint
  access-key: ${MINIO_ACCESS_KEY:GK0514f8c0f3dbb3f683d53d65}  # Set from env or paste generated value
  secret-key: ${MINIO_SECRET_KEY:d4e2f9e1aa30b932d6bb80de7639b5ab1640d48533f6822a8c99428e6335de77}
  bucket: ${MINIO_BUCKET:mealmarket-media}
  public-base-url: ${MINIO_PUBLIC_BASE_URL:http://mealmarket-media.web.garage.localhost:3902}
  presigned-expiry-seconds: 3600

# ─── SpringDoc / OpenAPI ────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    filter: true
    try-it-out-enabled: true
    enabled: true
    # Group selector
    groups-order: ASC
    doc-expansion: none
  show-actuator: false
  packages-to-scan: com.mealmarket.meal.infrastructure.web,com.mealmarket.ai.infrastructure.web
  default-produces-media-type: application/json

# ─── Actuator / Monitoring ──────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# ─── Logging ────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.mealmarket: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/meal-service.log

# ─── Feign Clients ──────────────────────────────────────────────
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

# ─── Application Specific ───────────────────────────────────────
mealmarket:
  ai:
    openrouter:
      base-url: ${OPENROUTER_BASE_URL:https://api.groq.com/openai/v1}
      api-key: ${OPENROUTER_API_KEY:}
      model: ${OPENROUTER_MODEL:openrouter/free}
  storage:
    max-image-size: 5242880  # 5MB in bytes
    allowed-image-types:
      - image/jpeg
      - image/png
      - image/webp

# ─── Keycloak Specific ───────────────────────────────────────
keycloak:
  admin:
    url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:mealmarket}
    username: ${KEYCLOAK_ADMIN_USER:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    client-id: admin-cli

resilience4j:
  # ─── Default Retry Configuration ───
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        # Use exponential backoff with jitter to avoid thundering herd
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        # Retry on network issues, not on client errors (4xx)
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException

  # ─── Default Circuit Breaker Configuration ───
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        # Automatically transition from open to half-open to test recovery
        automaticTransitionFromOpenStateToHalfOpenEnabled: true
        # Count network errors as failures
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException

  # ─── Default Rate Limiter ───
  # Protects your app from overwhelming external services
  ratelimiter:
    configs:
      default:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 0