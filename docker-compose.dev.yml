version: '3.8'

services:

  # ═══════════════════════════════════════════════════════════
  #  POSTGRESQL (meal_db)
  # ═══════════════════════════════════════════════════════════
  meal-db:
    image: postgres:18-alpine
    container_name: meal-db
    environment:
      POSTGRES_USER: mealuser
      POSTGRES_PASSWORD: mealpass123
      POSTGRES_DB: meal_db
    ports:
      - "5432:5432"
    volumes:
      - meal-db-data:/var/lib/postgresql/data
    networks:
      - meal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealuser -d meal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════
  #  REDIS
  # ═══════════════════════════════════════════════════════════
  redis:
    image: redis:8.2
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - meal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════
  #  POSTGRESQL (Keycloak)
  # ═══════════════════════════════════════════════════════════
  keycloak-db:
    image: postgres:18-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass123
      POSTGRES_DB: keycloak
    ports:
      - "5434:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - meal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ═══════════════════════════════════════════════════════════
  #  KEYCLOAK 26 (with health check enabled)
  # ═══════════════════════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: keycloak
    command: start-dev --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass123

      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"    # Management/health endpoint (Keycloak 26)
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - meal-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s


  # ═══════════════════════════════════════════════════════════
  #  PGADMIN (Database inspection UI)
  # ═══════════════════════════════════════════════════════════
  pgadmin:
    image: dpage/pgadmin4:8.13
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mealmarket.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      meal-db:
        condition: service_healthy
    networks:
      - meal-network
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 140s    # pgAdmin takes time to start

volumes:
  meal-db-data:
  keycloak-db-data:
  pgadmin-data:

networks:
  meal-network:
    driver: bridge