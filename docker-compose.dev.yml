version: '3.8'

services:

  # ═══════════════════════════════════════════════════════════
  #  POSTGRESQL (meal_db)
  # ═══════════════════════════════════════════════════════════
  meal-db:
    image: postgres:18-alpine
    container_name: meal-db
    environment:
      POSTGRES_USER: mealuser
      POSTGRES_PASSWORD: mealpass123
      POSTGRES_DB: meal_db
    ports:
      - "5432:5432"
    volumes:
      - meal-db-data:/var/lib/postgresql/data
    networks:
      - meal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealuser -d meal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════
  #  REDIS
  # ═══════════════════════════════════════════════════════════
  redis:
    image: redis:8.2
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - meal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════
  #  POSTGRESQL (Keycloak)
  # ═══════════════════════════════════════════════════════════
  keycloak-db:
    image: postgres:18-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass123
      POSTGRES_DB: keycloak
    ports:
      - "5434:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - meal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ═══════════════════════════════════════════════════════════
  #  KEYCLOAK 26 (with health check enabled)
  # ═══════════════════════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: keycloak
    command: start-dev --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass123

      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"    # Management/health endpoint (Keycloak 26)
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - meal-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s


  # ═══════════════════════════════════════════════════════════
  #  PGADMIN (Database inspection UI)
  # ═══════════════════════════════════════════════════════════
  pgadmin:
    image: dpage/pgadmin4:8.13
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mealmarket.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      meal-db:
        condition: service_healthy
    networks:
      - meal-network
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 140s    # pgAdmin takes time to start

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    command: /garage server --single-node --default-bucket
    ports:
      - "3900:3900"   # S3 API
      - "3902:3902"   # Static web hosting
      - "3903:3903"   # Admin API
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    environment:
      GARAGE_RPC_SECRET: "df3ab0acfc09f7d6fd3f727f7d3bd8e5ed9e07e6bfcfd6a12a046e1b8ce06117"           # openssl rand -hex 32
      GARAGE_ADMIN_TOKEN: "3a5afb87008d14a11c652c3e5ae20a9b9c17d786692570ae1218e6d42a4283cc"                  # openssl rand -hex 32
      GARAGE_DEFAULT_ACCESS_KEY: "GK0514f8c0f3dbb3f683d53d65"          # Must start with GK + 24 hex chars
      GARAGE_DEFAULT_SECRET_KEY: "d4e2f9e1aa30b932d6bb80de7639b5ab1640d48533f6822a8c99428e6335de77"    # 64 hex chars
      GARAGE_DEFAULT_BUCKET: "mealmarket-media"
    networks:
      - meal-network
    restart: unless-stopped

volumes:
  meal-db-data:
  keycloak-db-data:
  pgadmin-data:
  garage_meta:
  garage_data:

networks:
  meal-network:
    driver: bridge