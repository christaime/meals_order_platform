<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 120" fill="none">
  <defs>
    <linearGradient id="potBodyGradPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b83f00"/>
      <stop offset="50%" stop-color="#a43700"/>
      <stop offset="100%" stop-color="#732500"/>
    </linearGradient>

    <linearGradient id="mainSteamGradPin" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a43700" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#d95e09" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="sideSteamGradPin" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d95e09" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Center steam -->
  <path d="M 28 53 C 23 40, 33 29, 25 17 C 21 11, 26 5, 23 0"
        stroke="url(#mainSteamGradPin)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Left steam -->
  <path d="M 17 50 C 12 39, 16 28, 11 18 C 9 14, 11 8, 10 3"
        stroke="url(#sideSteamGradPin)"
        stroke-width="3"
        stroke-linecap="round"
        fill="none"/>

  <!-- Right steam -->
  <path d="M 38 52 C 44 42, 40 31, 44 21 C 46 16, 44 10, 42 5"
        stroke="#f59e0b"
        stroke-opacity="0.85"
        stroke-width="2.8"
        stroke-linecap="round"
        fill="none"/>

  <!-- Sparkles -->
  <circle cx="28" cy="-5" r="2"   fill="#f59e0b" opacity="0.9"/>
  <circle cx="40" cy="1"  r="1.5" fill="#d95e09" opacity="0.8"/>
  <circle cx="10" cy="-2" r="1.3" fill="#fbbf24" opacity="0.75"/>

  <!-- Left handle -->
  <path d="M 9 68 C 3 68, 3 75, 9 76"
        stroke="#732500"
        stroke-width="3.2"
        stroke-linecap="round"
        fill="none"/>

  <!-- Right handle -->
  <path d="M 47 68 C 53 68, 53 75, 47 76"
        stroke="#732500"
        stroke-width="3.2"
        stroke-linecap="round"
        fill="none"/>

  <!-- Pot body -->
  <path d="M 11 65 C 10 82, 15 92, 28 92 C 41 92, 45 82, 45 65 Z"
        fill="url(#potBodyGradPin)"/>

  <!-- Pot rim -->
  <ellipse cx="28" cy="65" rx="17" ry="5"
           fill="#f59e0b" stroke="#732500" stroke-width="1.8"/>
  <ellipse cx="28" cy="65" rx="14" ry="3.5" fill="#a43700"/>

  <!-- Body highlight -->
  <path d="M 15 70 C 14 77, 18 85, 23 88"
        stroke="#ffffff"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.4"/>

  <!-- Pin tip — anchor is the bottom point at (28, 110) -->
  <path d="M 19 91 L 28 110 L 37 91 Z" fill="#732500"/>
  <path d="M 21 91 L 28 108 L 35 91 Z" fill="#a43700"/>
</svg>
