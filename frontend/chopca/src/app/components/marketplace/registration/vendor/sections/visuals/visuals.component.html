<div
  [formGroup]="form()"
  class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm
         flex flex-col gap-space-md">

  <!-- ═══════════════════════════════════════════════════════
       Section header
       ═══════════════════════════════════════════════════════ -->
  <div class="flex items-center justify-between pb-space-sm">
    <div class="flex items-center gap-space-sm">
      <span
        class="w-9 h-9 rounded-lg bg-surface-container-highest text-on-surface
               flex items-center justify-center shrink-0">
        <app-icon name="photo_camera" size="md" />
      </span>
      <div>
        <h2 class="font-headline-sm text-headline-sm text-on-surface">
          Identité Visuelle &amp; Vitrine
        </h2>
      </div>
    </div>

  </div>

  <!-- ═══════════════════════════════════════════════════════
       Two-column: logo (5) + banner (7)
       ═══════════════════════════════════════════════════════ -->
  <div class="grid grid-cols-1 md:grid-cols-12 gap-space-md">

    <!-- ─── Logo ──────────────────────────────────────────── -->
    <div class="md:col-span-5 flex flex-col gap-space-xs">
      <div class="flex items-center justify-between">
        <span class="font-label-md text-label-md text-on-surface">
          Logo de l'enseigne <span class="text-primary">*</span>
        </span>
      </div>

      <app-image-uploader
        purpose="VENDOR_LOGO"
        shape="circle"
        label=""
        hint="PNG, WEBP ou JPEG (Max. 5 Mo)"
        [mediaRef]="profileMediaRef()"
        (uploaded)="logoUploaded.emit($event)"
        (cleared)="logoCleared.emit()" />

      @if (profileRef(); as ref) {
      <div
        class="inline-flex items-center gap-1 px-2 py-0.5 rounded
                 bg-surface-container-highest font-mono text-[10px]
                 text-on-surface-variant w-fit">
        <app-icon name="cloud_done" size="sm" class="text-secondary" />
        <span>ref: {{ ref }}</span>
      </div>
      }
    </div>

    <!-- ─── Banner ────────────────────────────────────────── -->
    <div class="md:col-span-7 flex flex-col gap-space-xs">
      <div class="flex items-center justify-between">
        <span class="font-label-md text-label-md text-on-surface">
          Bannière de couverture (16:9) <span class="text-primary">*</span>
        </span>
      </div>

      <app-image-uploader
        purpose="VENDOR_BANNER"
        shape="wide"
        label=""
        hint="Conseil : Privilégiez un plan serré de vos plats signatures"
        [mediaRef]="coverMediaRef()"
        (uploaded)="coverUploaded.emit($event)"
        (cleared)="coverCleared.emit()" />

      <div class="flex items-center justify-between">
        @if (coverRef(); as ref) {
        <div
          class="inline-flex items-center gap-1 px-2 py-0.5 rounded
                   bg-surface-container-highest font-mono text-[10px]
                   text-on-surface-variant">
          <app-icon name="cloud_done" size="sm" class="text-secondary" />
          <span>ref: {{ ref }}</span>
        </div>
        } @else {
        <span></span>
        }
        <span
          class="font-mono text-[10px] text-on-surface-variant
                 px-1.5 py-0.5 rounded bg-surface-container-highest">
          1920x1080 recommandé
        </span>
      </div>
    </div>
  </div>
</div>
