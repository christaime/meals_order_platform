<div
  class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm
         flex flex-col gap-space-md">

  <!-- ═══════════════════════════════════════════════════════
       Section header
       ═══════════════════════════════════════════════════════ -->
  <div class="flex items-center justify-between pb-space-sm">
    <div class="flex items-center gap-space-sm">
      <span
        class="w-9 h-9 rounded-lg bg-secondary-fixed text-on-secondary-fixed
               flex items-center justify-center shrink-0">
        <app-icon name="local_fire_department" size="md" />
      </span>
      <div>
        <h2 class="font-headline-sm text-headline-sm text-on-surface">
          {{ 'vendorCuisine.title' | translate }}
        </h2>
        <p class="font-body-sm text-body-sm text-on-surface-variant">
          {{ 'vendorCuisine.subtitle' | translate }}
        </p>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       Category pills — delegated to the shared selector
       ═══════════════════════════════════════════════════════ -->
  <app-category-pills-selector
    categoryType="CUISINE"
    [control]="cuisineControl()"
    [labelKey]="'vendorCuisine.label'"
    [hintKey]="'vendorCuisine.hint'"
    [maxSelection]="maxSelection()"
    [minSelection]="1"
    [error]="error()"
    [emptyMessageKey]="'vendorCuisine.empty'"
    (categoriesSelected)="categoriesSelected.emit($event)" />
</div>
