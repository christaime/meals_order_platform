<h2
  mat-dialog-title
  data-testid="new-ingredient-dialog"
  class="flex items-center gap-2">
  <mat-icon class="text-primary">local_fire_department</mat-icon>
  {{ prefill ? 'Modifier l\'ingrédient' : 'Nouvel ingrédient' }}
</h2>

<mat-dialog-content>
  <app-ingredient-form
    [ingredient]="prefill"
    (saved)="onSaved($event)"
    (cancelled)="onCancelled()" />
</mat-dialog-content>
