<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="flex flex-col gap-4 pt-2"
  novalidate>

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Nom de l'ingrédient</mat-label>
    <mat-icon matPrefix>label</mat-icon>
    <input
      matInput
      [formControl]="name"
      placeholder="Ex: Feuilles de Ndolé, Djansang…"
      autocomplete="off" />
    @if (nameError()) {
    <mat-error>{{ nameError() }}</mat-error>
    }
  </mat-form-field>

  <mat-checkbox formControlName="isAllergen">
    Cet ingrédient est un allergène
  </mat-checkbox>

  <div class="flex items-start gap-2 p-3 rounded-lg
              bg-amber-50 text-amber-900 text-xs">
    <mat-icon class="!text-base !w-4 !h-4 mt-0.5">info</mat-icon>
    <span>
      L'ingrédient sera créé en attente de validation.
      Vous pouvez l'utiliser immédiatement dans vos plats.
    </span>
  </div>

  @if (serverError()) {
  <div class="flex items-start gap-2 p-3 rounded-lg
                bg-red-50 text-red-900 text-xs">
    <mat-icon class="!text-base !w-4 !h-4 mt-0.5">error</mat-icon>
    <span>{{ serverError() }}</span>
  </div>
  }

  <div class="flex items-center justify-end gap-2 pt-2">
    <button
      type="button"
      mat-button
      (click)="onCancel()"
      [disabled]="submitting()">
      Annuler
    </button>

    <button
      type="submit"
      mat-flat-button
      color="primary"
      [disabled]="submitting()">
      @if (submitting()) {
      <mat-spinner diameter="18" class="inline-block mr-2" />
      <span>Enregistrement…</span>
      } @else {
      <mat-icon>check</mat-icon>
      <span>{{ isEditMode() ? 'Enregistrer' : 'Créer' }}</span>
      }
    </button>
  </div>

</form>
