<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm
            flex flex-wrap items-center gap-space-sm">

  <!-- Keyword -->
  <mat-form-field appearance="outline" class="flex-1 min-w-[220px]">
    <mat-label>{{ 'cityFilters.searchLabel' | translate }}</mat-label>
    <app-icon matPrefix name="search" size="md" class="text-on-surface-variant pr-2" />
    <input
      matInput
      [value]="keyword()"
      (input)="onKeywordInput($any($event.target).value)"
      [placeholder]="'cityFilters.searchPlaceholder' | translate"
      autocomplete="off" />
    @if (keyword()) {
    <button
      matSuffix
      mat-icon-button
      type="button"
      [attr.aria-label]="'cityFilters.clearAriaLabel' | translate"
      (click)="clearKeyword()">
      <app-icon name="close" size="sm" />
    </button>
    }
  </mat-form-field>

  <!-- Sort -->
  <mat-form-field appearance="outline" class="min-w-[200px]">
    <mat-label>{{ 'cityFilters.sortLabel' | translate }}</mat-label>
    <app-icon matPrefix name="sort" size="md" class="text-on-surface-variant pr-2" />
    <mat-select
      [value]="sort()"
      (selectionChange)="onSortChange($event.value)">
      <mat-option value="name-asc">{{ 'cityFilters.sort.nameAsc' | translate }}</mat-option>
      <mat-option value="name-desc">{{ 'cityFilters.sort.nameDesc' | translate }}</mat-option>
      <mat-option value="region-asc">{{ 'cityFilters.sort.regionAsc' | translate }}</mat-option>
      <mat-option value="region-desc">{{ 'cityFilters.sort.regionDesc' | translate }}</mat-option>
    </mat-select>
  </mat-form-field>
</div>
