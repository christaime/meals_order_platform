<!-- Trigger Button -->
<button
  type="button"
  data-testid="advanced-filter-trigger"
  (click)="openDrawer()"
  class="inline-flex items-center gap-2 px-4 py-3 rounded-full bg-surface-container-lowest border border-outline-variant text-on-surface hover:bg-surface-container-low transition-colors shadow-xs"
>
  <app-icon name="tune" size="sm" class="text-primary" />
  <span class="font-label-md text-xs font-semibold">Filtres</span>
</button>

<!-- Backdrop & Drawer -->
@if (isOpen()) {
<div
  data-testid="advanced-filter-backdrop"
  class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 transition-opacity"
  (click)="closeDrawer()"
></div>

<aside
  data-testid="advanced-filter-drawer"
  class="fixed inset-y-0 right-0 w-full max-w-md bg-surface-container-lowest z-50 shadow-2xl flex flex-col justify-between animate-in slide-in-from-right duration-250"
>
  <!-- Drawer Header -->
  <div class="p-5 border-b border-outline-variant flex items-center justify-between">
    <div class="flex items-center gap-2">
      <app-icon name="tune" class="text-primary" />
      <h2 class="font-headline-sm text-lg font-bold text-on-surface">Filtres avancés</h2>
    </div>
    <button
      type="button"
      data-testid="advanced-filter-close"
      (click)="closeDrawer()"
      class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors"
    >
      <app-icon name="close" size="sm" />
    </button>
  </div>

  <!-- Drawer Body -->
  <div class="p-6 flex-1 overflow-y-auto flex flex-col gap-6">

    <!-- Price range -->
    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label class="font-label-md text-xs font-bold text-on-surface uppercase tracking-wider">
            Prix minimum
          </label>
          <span
            data-testid="advanced-filter-min-price-value"
            class="font-body-md text-sm font-bold text-primary">
            {{ draftFilters().minPrice | appAmount }}
          </span>
        </div>
        <input
          type="range"
          data-testid="advanced-filter-min-price"
          [min]="priceMin"
          [max]="priceMax"
          [step]="priceStep"
          [value]="draftFilters().minPrice"
          (input)="updateMinPrice($event)"
          class="w-full accent-primary cursor-pointer"
        />
        <div class="flex justify-between text-[10px] text-on-surface-variant font-medium">
          <span>1 000 FCFA</span>
          <span>20 000 FCFA</span>
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label class="font-label-md text-xs font-bold text-on-surface uppercase tracking-wider">
            Prix maximum
          </label>
          <span
            data-testid="advanced-filter-max-price-value"
            class="font-body-md text-sm font-bold text-primary">
            {{ draftFilters().maxPrice | appAmount }}
          </span>
        </div>
        <input
          type="range"
          data-testid="advanced-filter-max-price"
          [min]="priceMin"
          [max]="priceMax"
          [step]="priceStep"
          [value]="draftFilters().maxPrice"
          (input)="updateMaxPrice($event)"
          class="w-full accent-primary cursor-pointer"
        />
        <div class="flex justify-between text-[10px] text-on-surface-variant font-medium">
          <span>1 000 FCFA</span>
          <span>20 000 FCFA</span>
        </div>
      </div>
    </div>

    <!-- Max Prep Time -->
    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <label class="font-label-md text-xs font-bold text-on-surface uppercase tracking-wider">
          Temps de préparation max
        </label>
        <span class="font-body-md text-sm font-bold text-primary">
          {{ draftFilters().maxPrepTime }} min
        </span>
      </div>
      <input
        type="range"
        data-testid="advanced-filter-max-prep-time"
        min="15"
        max="180"
        step="5"
        [value]="draftFilters().maxPrepTime"
        (input)="updateMaxPrepTime($event)"
        class="w-full accent-primary cursor-pointer"
      />
    </div>

    <!-- Minimum Rating -->
    <div class="flex flex-col gap-2">
      <label class="font-label-md text-xs font-bold text-on-surface uppercase tracking-wider">
        Note minimale
      </label>
      <div class="flex items-center gap-2">
        @for (stars of [0, 3, 4, 4.5]; track stars) {
        <button
          type="button"
          [attr.data-testid]="'advanced-filter-rating-' + stars"
          [attr.aria-pressed]="draftFilters().minRating === stars"
          (click)="setMinRating(stars)"
          class="flex-1 py-2 rounded-xl border text-xs font-semibold transition-all"
          [class.bg-primary]="draftFilters().minRating === stars"
          [class.text-on-primary]="draftFilters().minRating === stars"
          [class.border-primary]="draftFilters().minRating === stars"
          [class.bg-surface-container-low]="draftFilters().minRating !== stars"
          [class.text-on-surface-variant]="draftFilters().minRating !== stars"
          [class.border-outline-variant]="draftFilters().minRating !== stars"
        >
          {{ stars === 0 ? 'Toutes' : stars + '+ ★' }}
        </button>
        }
      </div>
    </div>

    <!-- Excluded ingredients -->
    <div class="flex flex-col gap-2 pt-2 border-t border-outline-variant">
      <app-ingredient-autocomplete
        label="Exclure des ingrédients"
        hint="Les plats contenant ces ingrédients seront masqués."
        [maxSelection]="5"
        [initialSelection]="initialIngredients"
        (selectionChange)="onExcludedIngredientsChange($event)"
      />
    </div>
    <!-- Category pills -->
    <div class="flex flex-col gap-4 pt-2 border-t border-outline-variant">
      <app-category-pills-selector
        categoryType="CUISINE"
        [control]="cuisineControl"
        label="Cuisines"
        [maxSelection]="3"
        [minSelection]="0"
        (categoriesSelected)="onCuisinesSelected($event)" />

      <app-category-pills-selector
        categoryType="DISH_TYPE"
        [control]="dishTypeControl"
        label="Types de plat"
        [maxSelection]="3"
        [minSelection]="0"
        (categoriesSelected)="onDishTypesSelected($event)" />
    </div>

  </div>

  <!-- Footer -->
  <div class="p-5 border-t border-outline-variant bg-surface-container-low flex items-center gap-3">
    <button
      type="button"
      data-testid="clear-all-advanced-filter"
      (click)="clearAll()"
      class="px-4 py-3 rounded-full border border-outline-variant text-on-surface font-label-md text-xs font-semibold hover:bg-surface-container
         active:scale-95 active:bg-surface-container-high
         focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2
         transition-all duration-150"
    >
      Tout effacer
    </button>
    <button
      type="button"
      data-testid="advanced-filter-apply"
      (click)="onApply()"
      class="flex-1 py-3 rounded-full bg-primary text-on-primary font-label-md text-xs font-bold hover:bg-primary-container transition-colors shadow-sm"
    >
      Appliquer les filtres
    </button>
  </div>
</aside>
}
