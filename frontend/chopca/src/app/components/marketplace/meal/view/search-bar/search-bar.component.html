<div class="relative flex items-center w-full group">
  <!-- Search Icon -->
  <div class="absolute left-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
    <app-icon name="search" size="md" />
  </div>

  <!-- Search Input -->
  <input
    type="text"
    [value]="query()"
    [placeholder]="placeholder()"
    (input)="onInput($event)"
    (keydown)="onKeyDown($event)"
    class="w-full pl-12 pr-24 py-3.5 rounded-full bg-surface-container-lowest border border-outline-variant/50 text-on-surface placeholder:text-on-surface-variant/70 text-body-md font-body-md focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 shadow-xs transition-all"
  />

  <!-- Actions Container -->
  <div class="absolute right-2 flex items-center gap-1">
    <!-- Clear Button -->
    @if (query().length > 0) {
    <button
      type="button"
      aria-label="Effacer la recherche"
      (click)="onClear()"
      class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors"
    >
      <app-icon name="close" size="sm" />
    </button>
    }

    <!-- Search Action Button -->
    <button
      type="button"
      aria-label="Lancer la recherche"
      (click)="onSubmit()"
      class="px-4 py-2 rounded-full bg-primary text-on-primary font-label-md text-xs font-semibold hover:bg-primary-container transition-colors shadow-xs"
    >
      Chercher
    </button>
  </div>
</div>
