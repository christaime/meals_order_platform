<div class="flex flex-col gap-6">

  <!-- ═════════ Name ═════════ -->
  <div class="flex flex-col gap-1">
    <label for="meal-name" class="text-xs font-semibold text-on-surface">
      {{ 'stepIdentity.name.label' | translate }} <span class="text-error">*</span>
    </label>
    <input
      data-testid="step-identity-name"
      id="meal-name"
      type="text"
      [formControl]="name"
      [placeholder]="'stepIdentity.name.placeholder' | translate"
      class="w-full h-11 px-3 rounded-lg bg-surface-container-low text-on-surface
             font-body-md text-sm placeholder:text-outline border border-outline-variant
             focus:outline-none focus:ring-2 focus:ring-primary" />
    @if (nameError()) {
    <p
      data-testid="step-identity-name-error"
      class="text-xs text-error">{{ nameError() }}</p>
    }
    <p class="text-[11px] text-on-surface-variant">
      {{ 'stepIdentity.name.hint' | translate }}
    </p>
  </div>

  <!-- ═════════ Cuisines ═════════ -->
  <app-category-pills-selector
    data-testid="step-identity-cuisines"
    categoryType="CUISINE"
    [control]="cuisineIds"
    [labelKey]="'stepIdentity.cuisines.label'"
    [hintKey]="'stepIdentity.cuisines.hint'"
    [minSelection]="1"
    [maxSelection]="3"
    [error]="cuisineError()"
    [emptyMessageKey]="'stepIdentity.cuisines.emptyMessage'" />

  <!-- ═════════ Dish types ═════════ -->
  <app-category-pills-selector
    data-testid="step-identity-dish-types"
    categoryType="DISH_TYPE"
    [control]="dishTypeIds"
    [labelKey]="'stepIdentity.dishTypes.label'"
    [hintKey]="'stepIdentity.dishTypes.hint'"
    [minSelection]="1"
    [maxSelection]="3"
    [error]="dishTypeError()"
    [emptyMessageKey]="'stepIdentity.dishTypes.emptyMessage'" />

  <!-- ═════════ Description + Image (image 1/3 left, description 2/3 right) ═════════ -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-start">

    <!-- Image — left, 1/3 -->
    <div class="md:col-span-1">
      <app-image-uploader
        data-testid="step-identity-image-uploader"
        purpose="MEAL_IMAGE"
        shape="wide"
        [label]="'stepIdentity.image.label' | translate"
        [hint]="'stepIdentity.image.hint' | translate"
        [mediaRef]="imageMedia()"
        [maxSizeMb]="8"
        (uploaded)="imageUploaded.emit($event)"
        (cleared)="imageCleared.emit()" />
    </div>

    <!-- Description — right, 2/3 -->
    <div class="md:col-span-2 flex flex-col gap-1">
      <label for="meal-description" class="text-xs font-semibold text-on-surface">
        {{ 'stepIdentity.description.label' | translate }}
      </label>
      <textarea
        data-testid="step-identity-description"
        id="meal-description"
        [formControl]="description"
        rows="8"
        maxlength="300"
        [placeholder]="'stepIdentity.description.placeholder' | translate"
        class="w-full px-3 py-2 rounded-lg bg-surface-container-low text-on-surface
               font-body-md text-sm placeholder:text-outline border border-outline-variant
               focus:outline-none focus:ring-2 focus:ring-primary resize-none"></textarea>
      <p
        data-testid="step-identity-description-length"
        class="text-[11px] text-on-surface-variant text-right">
        {{ descriptionLength() }}/300
      </p>
    </div>
  </div>

</div>
