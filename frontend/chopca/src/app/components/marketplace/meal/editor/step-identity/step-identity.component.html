<div class="flex flex-col gap-6">

  <!-- ═════════ Name ═════════ -->
  <div class="flex flex-col gap-1">
    <label for="meal-name" class="text-xs font-semibold text-on-surface">
      Nom du plat <span class="text-error">*</span>
    </label>
    <input
      id="meal-name"
      type="text"
      [formControl]="name"
      placeholder="Ex: Mbongo Tchobi de Capitaine, Poulet DG…"
      class="w-full h-11 px-3 rounded-lg bg-surface-container-low text-on-surface
             font-body-md text-sm placeholder:text-outline border border-outline-variant
             focus:outline-none focus:ring-2 focus:ring-primary" />
    @if (nameError()) {
    <p class="text-xs text-error">{{ nameError() }}</p>
    }
    <p class="text-[11px] text-on-surface-variant">
      Mentionnez l'accompagnement signature pour booster les commandes.
    </p>
  </div>

  <!-- ═════════ Cuisines ═════════ -->
  <app-category-pills-selector
    categoryType="CUISINE"
    [control]="cuisineIds"
    label="Origine culinaire & spécialité"
    hint="Choisissez jusqu'à 3 cuisines (minimum 1)."
    [minSelection]="1"
    [maxSelection]="3"
    [error]="cuisineError()"
    emptyMessage="Aucune cuisine disponible." />

  <!-- ═════════ Dish types ═════════ -->
  <app-category-pills-selector
    categoryType="DISH_TYPE"
    [control]="dishTypeIds"
    label="Type de plat"
    hint="Plat principal, dessert, boisson… (minimum 1)."
    [minSelection]="1"
    [maxSelection]="3"
    [error]="dishTypeError()"
    emptyMessage="Aucun type de plat disponible." />

  <!-- ═════════ Description + Image (image 1/3 left, description 2/3 right) ═════════ -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-start">

    <!-- Image — left, 1/3 -->
    <div class="md:col-span-1">
      <app-image-uploader
        purpose="MEAL_IMAGE"
        shape="wide"
        label="Photographie du plat"
        hint="JPG, PNG ou WebP, jusqu'à 8 Mo. Format 4:3 recommandé."
        [mediaRef]="imageMedia()"
        [maxSizeMb]="8"
        (uploaded)="imageUploaded.emit($event)"
        (cleared)="imageCleared.emit()" />
    </div>

    <!-- Description — right, 2/3 -->
    <div class="md:col-span-2 flex flex-col gap-1">
      <label for="meal-description" class="text-xs font-semibold text-on-surface">
        Description
      </label>
      <textarea
        id="meal-description"
        [formControl]="description"
        rows="8"
        maxlength="300"
        placeholder="Décrivez le plat, ses saveurs, son origine…"
        class="w-full px-3 py-2 rounded-lg bg-surface-container-low text-on-surface
               font-body-md text-sm placeholder:text-outline border border-outline-variant
               focus:outline-none focus:ring-2 focus:ring-primary resize-none"></textarea>
      <p class="text-[11px] text-on-surface-variant text-right">
        {{ descriptionLength() }}/300
      </p>
    </div>
  </div>

</div>
