<div class="flex flex-col sm:flex-row items-center justify-between
            gap-4 pt-2">

  <!-- LEFT SIDE -->
  <div>
    @if (!isFirstStep()) {
    <button
      type="button"
      (click)="onPrevious()"
      [disabled]="submitting()"
      class="w-full sm:w-auto
               inline-flex items-center justify-center gap-2
               px-5 py-2.5 rounded-lg
               font-label text-sm
               text-on-surface-variant
               bg-transparent border-0 cursor-pointer
               hover:bg-surface-container transition-colors
               disabled:opacity-50 disabled:cursor-not-allowed">
      <app-icon name="arrow_back" size="sm" />
      <span>{{ previousLabel() }}</span>
    </button>
    }
  </div>

  <!-- RIGHT SIDE -->
  <div class="flex items-center gap-3 w-full sm:w-auto">
    @if (isLastStep()) {
    <button
      type="button"
      (click)="onSaveDraft()"
      [disabled]="submitting()"
      class="w-1/2 sm:w-auto
               px-5 py-3 rounded-lg
               font-label text-sm
               bg-surface-container hover:bg-surface-container-highest
               text-on-surface
               border-0 cursor-pointer transition-colors
               disabled:opacity-50 disabled:cursor-not-allowed">
      Enregistrer le brouillon
    </button>
    }

    @if (!isLastStep()) {
    <button
      type="button"
      (click)="onNext()"
      [disabled]="submitting()"
      class="w-full sm:w-auto
               inline-flex items-center justify-center gap-2
               px-6 py-3 rounded-lg
               bg-primary hover:bg-primary-container
               text-on-primary
               font-label text-sm font-bold
               shadow-md transition-all
               border-0 cursor-pointer
               disabled:opacity-50 disabled:cursor-not-allowed">
      <span>{{ nextLabel() }}</span>
      <app-icon name="arrow_forward" size="sm" />
    </button>
    }

    @if (isLastStep()) {
    <button
      type="button"
      (click)="onPublish()"
      [disabled]="submitting()"
      class="w-1/2 sm:w-auto
               inline-flex items-center justify-center gap-2
               px-6 py-3 rounded-lg
               bg-secondary hover:bg-secondary/90
               text-on-secondary
               font-label text-sm font-bold
               shadow-md transition-all
               border-0 cursor-pointer
               disabled:opacity-50 disabled:cursor-not-allowed">
      @if (submitting()) {
      <app-icon name="progress_activity" size="sm" class="animate-spin" />
      <span>Publication…</span>
      } @else {
      <app-icon name="check_circle" size="sm" />
      <span>Valider et publier le plat</span>
      }
    </button>
    }
  </div>

</div>
