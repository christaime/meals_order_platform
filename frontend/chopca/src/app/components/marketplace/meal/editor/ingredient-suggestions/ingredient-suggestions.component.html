<div class="p-4 rounded-xl bg-surface-container-low">
  <span class="block font-label text-[11px] uppercase tracking-wider
               text-on-surface-variant font-bold mb-2">
    Suggestions fréquentes (cliquez pour ajouter)
  </span>

  <div class="flex flex-wrap gap-2">
    @for (suggestion of visibleSuggestions; track suggestion.id) {
    <button
      type="button"
      (click)="onSuggestionClick(suggestion)"
      class="inline-flex items-center gap-1
               px-2.5 py-1 rounded-full
               bg-surface-container-lowest
               text-on-surface
               font-label text-xs
               shadow-xs
               transition-all cursor-pointer border-0
               hover:bg-primary hover:text-on-primary">
      <app-icon name="add" size="sm" />
      <span>{{ suggestion.name }}</span>
    </button>
    }

    @if (visibleSuggestions.length === 0) {
    <span class="font-body text-xs text-on-surface-variant italic">
        Toutes les suggestions ont été ajoutées.
      </span>
    }
  </div>
</div>
