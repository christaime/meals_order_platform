<div class="p-4 rounded-xl
            bg-primary-fixed/40
            flex items-start gap-3">

  <app-icon [name]="icon()" size="md" class="text-primary shrink-0 mt-0.5" />

  <div class="flex flex-col gap-0.5 min-w-0">
    <span class="font-label text-xs font-bold text-on-primary-fixed">
      {{ title() }}
    </span>
    <p class="font-body text-xs text-on-primary-fixed opacity-90 m-0">
      {{ body() }}
    </p>
  </div>

</div>
