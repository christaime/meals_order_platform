<div class="min-h-screen flex items-center justify-center px-space-md">
  <div class="max-w-lg w-full bg-surface-container-lowest rounded-2xl p-space-xl shadow-md text-center">
    <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-error-container text-on-error-container
                flex items-center justify-center">
      <app-icon name="block" size="xl" />
    </div>

    <h1 class="font-headline-md text-headline-md text-on-surface font-bold">
      Accès refusé
    </h1>

    <p class="font-body-md text-body-md text-on-surface-variant mt-3">
      {{ message() }}
    </p>

    <p class="font-body-sm text-body-sm text-on-surface-variant mt-2">
      Si vous pensez qu'il s'agit d'une erreur, contactez le support Chop ça!.
    </p>

    <div class="mt-space-lg flex flex-col sm:flex-row gap-space-sm justify-center">
      <button
        type="button"
        (click)="goHome()"
        class="h-11 px-space-lg rounded-lg bg-primary hover:bg-primary-container
               text-on-primary font-label-lg text-label-lg font-bold
               flex items-center justify-center gap-2 shadow-md transition-colors">
        <app-icon name="storefront" size="md" />
        Retour au catalogue
      </button>
      <button
        type="button"
        (click)="logout()"
        class="h-11 px-space-lg rounded-lg bg-surface-container hover:bg-surface-container-high
               text-on-surface font-label-lg text-label-lg font-semibold transition-colors">
        Se déconnecter
      </button>
    </div>
  </div>
</div>
