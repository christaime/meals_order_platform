<div
  class="rounded-2xl bg-surface-container-lowest
         p-5 md:p-6
         shadow-sm
         flex flex-col md:flex-row items-center justify-between
         gap-5 md:gap-8">

  <!-- ─── Left: icon + message ──────────────────────────── -->
  <div class="flex items-center gap-4 w-full md:w-auto">

    <!-- Icon circle -->
    <div
      class="w-12 h-12 rounded-xl shrink-0
             bg-secondary-fixed text-on-secondary-fixed
             flex items-center justify-center">
      <app-icon name="payments" size="lg" />
    </div>

    <!-- Text block -->
    <div class="flex flex-col gap-0.5 min-w-0">
      <span class="font-heading text-base font-bold text-on-surface leading-tight">
        Versements quotidiens garantis
      </span>
      <span class="font-body text-xs text-on-surface-variant leading-snug">
        Vos recettes des ventes en ligne sont automatiquement versées sur votre
        compte mobile money chaque soir à 20h.
      </span>
    </div>
  </div>

  <!-- ─── Right: payment methods pills ──────────────────── -->
  <div class="flex flex-wrap items-center gap-2 justify-center md:justify-end shrink-0">
    @for (method of paymentMethods; track method) {
    <span
      class="px-3 py-1.5 rounded
               bg-surface-container text-on-surface
               font-label text-[11px] font-semibold
               whitespace-nowrap">
        {{ method }}
      </span>
    }
  </div>

</div>
