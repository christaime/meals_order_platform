<app-form-field
  [label]="label()"
  [required]="required()"
  [hint]="hint()"
  [trailingHint]="trailingHint()"
  [error]="error()"
  iconLeading="lock">

  <input
    [class]="INPUT_CLASSES"
    [type]="inputType()"
    [name]="name() ?? undefined"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [formControl]="control()"
    autocomplete="current-password" />

  <button
    trailing
    type="button"
    [attr.aria-label]="toggleAriaLabel()"
    [attr.aria-pressed]="visible()"
    (click)="toggleVisibility($event)"
    class="p-1 bg-transparent border-0 cursor-pointer
           text-on-surface-variant hover:text-on-surface
           transition-colors">
    <app-icon [name]="toggleIcon()" size="md" />
  </button>
</app-form-field>
