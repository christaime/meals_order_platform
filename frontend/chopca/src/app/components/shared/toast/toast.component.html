<div class="fixed bottom-6 right-6 z-[60] flex flex-col gap-3 pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
  <div
    class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl
             bg-on-surface text-inverse-on-surface shadow-2xl
             animate-[slideIn_0.25s_ease-out]"
    role="status">
    <app-icon
      [name]="iconFor(toast.kind)"
      size="md"
      [class]="iconColorFor(toast.kind)" />
    <span class="font-label-md text-label-md font-semibold">
        {{ toast.message }}
      </span>
    <button
      type="button"
      (click)="toastService.dismiss(toast.id)"
      class="ml-2 text-inverse-on-surface/60 hover:text-inverse-on-surface
               bg-transparent border-0 cursor-pointer p-0 leading-none">
      <app-icon name="close" size="sm" />
    </button>
  </div>
  }
</div>
