<div class="flex flex-col gap-1">

  <!-- ─── Label row ─────────────────────────────────────── -->
  @if (label()) {
  <div class="flex items-center justify-between gap-2">
    <label
      [attr.for]="fieldId()"
      class="font-label text-xs font-semibold text-on-surface flex items-center gap-0.5">
      <span>{{ label() }}</span>
      @if (required()) {
      <span class="text-error">*</span>
      }
    </label>

    @if (trailingHint()) {
    <span class="font-label text-[11px] text-on-surface-variant">
          {{ trailingHint() }}
        </span>
    }
  </div>
  }

  <!-- ─── Field wrapper ─────────────────────────────────── -->
  <div [class]="wrapperClasses()">

    <!-- Leading icon -->
    @if (iconLeading()) {
    <span [class]="leadingIconClasses()">
        <app-icon [name]="iconLeading()!" size="md" />
      </span>
    }

    <!-- Content area (padding adjusts for leading icon) -->
    <div [class]="contentPaddingClasses()">
      <ng-content select="[appProjectedInput]"></ng-content>
      <ng-content></ng-content>
    </div>

    <!-- Trailing slot (positioned here, so children don't need absolute coords) -->
    <div class="absolute right-3.5 top-1/2 -translate-y-1/2 flex items-center
                pointer-events-none [&>*]:pointer-events-auto">
      <ng-content select="[trailing]"></ng-content>
    </div>

  </div>

  <!-- ─── Error message ─────────────────────────────────── -->
  <app-form-error [message]="error()" />

  <!-- ─── Optional hint under the input ─────────────────── -->
  @if (hint()) {
  <p class="font-label text-[11px] text-on-surface-variant m-0 -mt-0.5">
    {{ hint() }}
  </p>
  }

</div>
