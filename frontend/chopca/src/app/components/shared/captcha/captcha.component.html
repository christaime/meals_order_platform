<div class="flex flex-col gap-2">

  <!-- Label -->
  <div class="flex items-center gap-2">
    <app-icon name="verified_user" size="sm" class="text-secondary" />
    <span class="font-label text-xs font-semibold text-on-surface">
      Vérification anti-robot
    </span>
  </div>

  <!-- Turnstile widget -->
  <div class="flex items-center">
    <ngx-turnstile
      [siteKey]="siteKey"
      theme="light"
      (resolved)="onResolved($event)">
    </ngx-turnstile>
  </div>

  <!-- Error -->
  <app-form-error [message]="error()" />

</div>
