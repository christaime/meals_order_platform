<span [class]="classes()" [style.max-width]="maxWidth() ?? null">
  @if (icon()) {
    <app-icon
      [name]="icon()!"
      [filled]="filledIcon()"
      size="sm"
      [class.shrink-0]="truncate()" />
  }
  @if (truncate()) {
    <span class="block truncate"><ng-content /></span>
  } @else {
    <ng-content />
  }
</span>
