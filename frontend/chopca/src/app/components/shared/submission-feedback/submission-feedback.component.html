@if (message()) {
<div [class]="wrapperClasses()" role="alert" aria-live="polite">

  <app-icon
    [name]="iconName()"
    size="lg"
    [filled]="true"
    [class]="iconClasses() + ' shrink-0 mt-0.5'" />

  <div class="flex flex-col gap-1 min-w-0">
      <span class="font-heading text-sm font-bold">
        {{ message() }}
      </span>

    @if (detail()) {
    <span class="font-body text-xs leading-relaxed opacity-90">
          {{ detail() }}
        </span>
    }
  </div>

</div>
}
