<div class="flex flex-col gap-3">

  <!-- ═══════════════════════════════════════════════════════
       Google
       ═══════════════════════════════════════════════════════ -->
  <button
    type="button"
    [disabled]="disabled()"
    (click)="onClick('google')"
    class="w-full h-12 px-5 rounded-xl
           bg-surface-container-lowest
           border border-outline-variant/60
           hover:bg-surface-container-low hover:border-outline-variant
           flex items-center justify-center gap-3
           text-on-surface font-label text-sm font-semibold
           shadow-sm transition-all active:scale-[0.99]
           disabled:opacity-50 disabled:cursor-not-allowed
           disabled:hover:bg-surface-container-lowest">

    <!-- Google "G" logo -->
    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
        fill="#4285F4" />
      <path
        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
        fill="#34A853" />
      <path
        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
        fill="#FBBC05" />
      <path
        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
        fill="#EA4335" />
    </svg>

    <span>{{ ctaLabel() }} Google</span>
  </button>

  <!-- ═══════════════════════════════════════════════════════
       Outlook (Microsoft)
       ═══════════════════════════════════════════════════════ -->
  <button
    type="button"
    [disabled]="disabled()"
    (click)="onClick('outlook')"
    class="w-full h-12 px-5 rounded-xl
           bg-surface-container-lowest
           border border-outline-variant/60
           hover:bg-surface-container-low hover:border-outline-variant
           flex items-center justify-center gap-3
           text-on-surface font-label text-sm font-semibold
           shadow-sm transition-all active:scale-[0.99]
           disabled:opacity-50 disabled:cursor-not-allowed
           disabled:hover:bg-surface-container-lowest">

    <!-- Microsoft Outlook logo -->
    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
      <!-- Left blue panel (Outlook "O") -->
      <path
        d="M21.5 6.5v11c0 .55-.45 1-1 1H12v-6.1l3.4 2.6L21.5 6.5z"
        fill="#0A2767" />
      <path
        d="M21.5 6.5L15.4 11.7 12 14.4V5.5h8.5c.55 0 1 .45 1 1z"
        fill="#0364B8" />
      <path
        d="M3.5 5.5h8v13h-8c-.55 0-1-.45-1-1v-11c0-.55.45-1 1-1z"
        fill="#0F6CBD" />
      <circle cx="7.5" cy="12" r="3.2" fill="#FFFFFF" />
      <circle cx="7.5" cy="12" r="1.8" fill="#0F6CBD" />
      <path
        d="M12 18.5h8.5c.55 0 1-.45 1-1v-1L15 20l-3-1.5z"
        fill="#0A2767"
        opacity="0.5" />
    </svg>

    <span>{{ ctaLabel() }} Outlook</span>
  </button>

  <!-- ═══════════════════════════════════════════════════════
       Yahoo
       ═══════════════════════════════════════════════════════ -->
  <button
    type="button"
    [disabled]="disabled()"
    (click)="onClick('yahoo')"
    class="w-full h-12 px-5 rounded-xl
           bg-surface-container-lowest
           border border-outline-variant/60
           hover:bg-surface-container-low hover:border-outline-variant
           flex items-center justify-center gap-3
           text-on-surface font-label text-sm font-semibold
           shadow-sm transition-all active:scale-[0.99]
           disabled:opacity-50 disabled:cursor-not-allowed
           disabled:hover:bg-surface-container-lowest">

    <!-- Yahoo "Y!" logo -->
    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M12.72 10.68l2.72-6.13h-3.05l-1.6 4.02-1.57-4.02H6.15l3.02 6.13-.15 6.32h3.55l.15-6.32z"
        fill="#5F01D1" />
      <path
        d="M16.95 17.32c-1.05 0-1.9-.85-1.9-1.9s.85-1.9 1.9-1.9 1.9.85 1.9 1.9-.85 1.9-1.9 1.9z"
        fill="#5F01D1" />
    </svg>

    <span>{{ ctaLabel() }} Yahoo</span>
  </button>

</div>
